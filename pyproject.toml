[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "biometry-parser"
version = "0.1.0"
description = "Lightweight, evidence-preserving IOLMaster 700 biometry and IOL calculation parsing"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.9,<3", "pypdfium2>=4.30,<6", "Pillow>=10,<14", "psutil>=5.9,<8"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Operating System :: OS Independent",
  "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.optional-dependencies]
ocr = ["rapidocr==3.10.0", "onnxruntime>=1.20,<2"]
test = ["pytest>=8,<10", "build>=1.2,<2"]

[project.scripts]
biometry-parser = "biometry_parser.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["biometry_parser*"]

[tool.setuptools.package-data]
biometry_parser = ["schemas/*.json", "model_manifest.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: optional installed local engine checks"]
